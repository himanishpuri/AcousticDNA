# Hardened overlay for showcase/production runs. Layer it on top of the base:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  server:
    read_only: true # immutable rootfs; all writes go to declared mounts
    security_opt:
      - no-new-privileges:true # block setuid privilege escalation
    cap_drop:
      - ALL # server binds 8080 (>1024) + needs no Linux caps
    tmpfs:
      # Writable scratch for ffmpeg/yt-dlp temp files under a read-only rootfs.
      # exec: static yt-dlp self-extracts + maps libs from /tmp (noexec blocks it).
      - /tmp:exec
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
